<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Virtual Earring Try-On | OpenCV + MediaPipe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.4.1646424915/camera_utils.js"></script>

  <!-- OpenCV -->
  <script>
    window.Module = {
      onRuntimeInitialized() {
        window.dispatchEvent(new Event("opencv-ready"));
      },
    };
  </script>
  <script src="https://docs.opencv.org/4.10.0/opencv.js"></script>

  <!-- Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
        "jsm/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
      }
    }
  </script>

  <style>
    :root {
      --bg-1: #0a1f2f;
      --bg-2: #12334a;
      --panel: rgba(10, 22, 33, 0.72);
      --stroke: rgba(149, 205, 255, 0.25);
      --text: #e9f4ff;
      --text-soft: #b4ccdf;
      --accent: #ff7a45;
      --accent-2: #34d1bf;
      --radius: 18px;
      --shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 12% 18%, rgba(52, 209, 191, 0.16), transparent 38%),
        radial-gradient(circle at 87% 83%, rgba(255, 122, 69, 0.2), transparent 42%),
        linear-gradient(145deg, var(--bg-1) 0%, var(--bg-2) 100%);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      overflow-x: hidden;
    }

    .app-shell {
      min-height: 100vh;
      padding: 22px;
    }

    .topbar {
      margin: 0 auto 16px;
      max-width: 1400px;
      padding: 16px 20px;
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      background: var(--panel);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
    }

    .topbar h1 {
      margin: 0;
      font-family: 'Sora', sans-serif;
      font-size: clamp(1.05rem, 1.1rem + 0.8vw, 1.9rem);
      letter-spacing: 0.04em;
      font-weight: 700;
    }

    .topbar p {
      margin: 7px 0 0;
      color: var(--text-soft);
      font-size: 0.92rem;
    }

    .workspace {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(230px, 300px) minmax(320px, 740px) minmax(230px, 300px);
      gap: 16px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      background: var(--panel);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .panel-title {
      margin: 2px 0 12px;
      font-size: 0.84rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-2);
    }

    .viewer-wrap {
      display: grid;
      justify-items: center;
      gap: 14px;
    }

    #stack {
      position: relative;
      width: min(54vw, 560px);
      aspect-ratio: 1 / 1;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      background: #040a11;
    }

    #canvas, #three-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #video {
      position: absolute;
      inset: 0;
      width: 0;
      height: 0;
      opacity: 0;
    }

    #info {
      margin: 0;
      min-height: 270px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(52, 209, 191, 0.35);
      background: rgba(0, 0, 0, 0.24);
      white-space: pre-wrap;
      color: #abffd5;
      font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      line-height: 1.45;
    }

    #controls {
      border: 1px solid rgba(255, 122, 69, 0.34);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      padding: 14px;
    }

    #controls label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
      cursor: pointer;
      user-select: none;
      color: var(--text);
      font-size: 0.92rem;
    }

    #controls input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      margin: 0;
    }

    .hint-card {
      margin-top: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 11px;
      color: var(--text-soft);
      font-size: 0.84rem;
      line-height: 1.45;
    }

    #capture-btn {
      z-index: 5;
      padding: 11px 30px;
      border: 0;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      color: #091825;
      background: linear-gradient(120deg, var(--accent) 0%, #ffb454 100%);
      box-shadow: 0 10px 24px rgba(255, 122, 69, 0.35);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    #capture-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 16px 28px rgba(255, 122, 69, 0.42);
    }

    @media (max-width: 1160px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .viewer-wrap {
        order: 1;
      }

      .panel-left {
        order: 2;
      }

      .panel-right {
        order: 3;
      }

      #stack {
        width: min(82vw, 420px);
      }

      #info {
        min-height: 220px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <main class="workspace">
      <aside class="panel panel-left">
        <h2 class="panel-title">Suivi en direct</h2>
        <div id="info">Loading OpenCV...</div>
      </aside>

      <section class="viewer-wrap">
        <div id="stack">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="canvas"></canvas>
          <canvas id="three-canvas"></canvas>
        </div>
        <button id="capture-btn">Capture image</button>
      </section>

      <aside class="panel panel-right">
        <h2 class="panel-title">Controles</h2>
        <div id="controls">
          <label><input id="mirrorPreview" type="checkbox" checked disabled> Mirror preview</label>
          <label><input id="showAllLandmarks" type="checkbox"> Show all 468 points</label>
          <label><input id="showEarLandmarks" type="checkbox" checked> Show ear landmarks</label>
          <label><input id="showEarrings" type="checkbox" checked> Show earrings</label>
        </div>
        <div class="hint-card">
          Activez seulement les reperes utiles pour garder un rendu propre et un meilleur framerate.
        </div>
      </aside>
    </main>
  </div>

  <script type="module">
    import { initEarringTryOn, updateEarringTryOn } from './main.js';

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const info = document.getElementById('info');
    const threeCanvas = document.getElementById('three-canvas');
    
    const chkMirror = document.getElementById('mirrorPreview');
    const chkAllLandmarks = document.getElementById('showAllLandmarks');
    const chkEarLandmarks = document.getElementById('showEarLandmarks');
    const chkShowEarrings = document.getElementById('showEarrings');
    const captureBtn = document.getElementById('capture-btn');

    chkMirror.checked = true;

    // ALL ear-related landmark indices for debugging
    const EAR_LANDMARKS = {
      // Left side (user's left = screen right)
      LEFT_EAR_TOP: 234,
      LEFT_EAR_MID: 93,
      LEFT_EAR_LOBE_A: 132,  // Good candidate
      LEFT_EAR_LOBE_B: 172,  // Lower candidate
      LEFT_TEMPLE: 127,
      LEFT_CHEEK: 116,
      LEFT_JAW: 147,
      
      // Right side (user's right = screen left)  
      RIGHT_EAR_TOP: 454,
      RIGHT_EAR_MID: 323,
      RIGHT_EAR_LOBE_A: 361, // Good candidate
      RIGHT_EAR_LOBE_B: 397, // Lower candidate
      RIGHT_TEMPLE: 356,
      RIGHT_CHEEK: 345,
      RIGHT_JAW: 376,
      
      // Face reference
      NOSE_TIP: 1,
      CHIN: 152,
      FOREHEAD: 10,
      LEFT_EYE: 33,
      RIGHT_EYE: 263,
      CENTER: 168
    };

    let dpr = 1;

    function setCanvasSize(canvasEl) {
      const cssW = document.getElementById('stack').clientWidth;
      const cssH = document.getElementById('stack').clientHeight;
      const isAndroid = /Android/i.test(navigator.userAgent);
      const dprCap = isAndroid ? 1.5 : 2;
      dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, dprCap));
      
      canvasEl.style.width = cssW + 'px';
      canvasEl.style.height = cssH + 'px';
      canvasEl.width = Math.floor(cssW * dpr);
      canvasEl.height = Math.floor(cssH * dpr);
      return dpr;
    }

    setCanvasSize(canvas);
    setCanvasSize(threeCanvas);
    window.addEventListener('resize', () => {
      setCanvasSize(canvas);
      setCanvasSize(threeCanvas);
    });

    function drawVideoCover(ctx, videoEl) {
      const dstW = canvas.width, dstH = canvas.height;
      const srcW = videoEl.videoWidth || 1;
      const srcH = videoEl.videoHeight || 1;

      const scale = Math.max(dstW / srcW, dstH / srcH);
      const drawW = Math.round(srcW * scale);
      const drawH = Math.round(srcH * scale);
      const dx = Math.floor((dstW - drawW) * 0.5);
      const dy = Math.floor((dstH - drawH) * 0.5);

      ctx.save();
      ctx.setTransform(1,0,0,1,0,0);
      ctx.clearRect(0, 0, dstW, dstH);
      if (chkMirror.checked) { ctx.translate(dstW, 0); ctx.scale(-1, 1); }
      ctx.drawImage(videoEl, 0, 0, srcW, srcH, dx, dy, drawW, drawH);
      ctx.restore();

      return { dx, dy, drawW, drawH, dstW, dstH, srcW, srcH, dpr };
    }

    function drawEarLandmarks(ctx, lm, cover) {
      const map = (p) => {
        const x = cover.dx + p.x * cover.drawW;
        const y = cover.dy + p.y * cover.drawH;
        return chkMirror.checked ? { x: cover.dstW - x, y } : { x, y };
      };

      ctx.save();

      // Draw ALL 468 landmarks if enabled
      if (chkAllLandmarks.checked) {
        ctx.fillStyle = 'rgba(0, 255, 0, 0.2)';
        for (let i = 0; i < lm.length; i++) {
          const p = lm[i];
          if (!p) continue;
          const q = map(p);
          ctx.beginPath();
          ctx.arc(q.x, q.y, 1.5 * dpr, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Draw ear landmarks if enabled
      if (chkEarLandmarks.checked) {
        // Define colors for each type
        const colors = {
          lobe: '#00ffff',      // Cyan - main lobe points
          ear: '#00ff00',       // Green - ear area
          temple: '#ffff00',    // Yellow - temple
          reference: '#ff0000', // Red - face reference
        };

        // Draw main ear lobe candidates (CYAN - most important)
        ctx.fillStyle = colors.lobe;
        ctx.font = `bold ${11 * dpr}px monospace`;
        const lobePoints = [
          { idx: EAR_LANDMARKS.LEFT_EAR_LOBE_A, label: '#132 L' },
          { idx: EAR_LANDMARKS.LEFT_EAR_LOBE_B, label: '#172 L' },
          { idx: EAR_LANDMARKS.RIGHT_EAR_LOBE_A, label: '#361 R' },
          { idx: EAR_LANDMARKS.RIGHT_EAR_LOBE_B, label: '#397 R' },
        ];
        for (const pt of lobePoints) {
          const p = lm[pt.idx];
          if (!p) continue;
          const q = map(p);
          ctx.beginPath();
          ctx.arc(q.x, q.y, 6 * dpr, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillText(pt.label, q.x + 8 * dpr, q.y + 4 * dpr);
        }

        // Draw ear top points (GREEN)
        ctx.fillStyle = colors.ear;
        ctx.font = `${10 * dpr}px monospace`;
        const earPoints = [
          { idx: EAR_LANDMARKS.LEFT_EAR_TOP, label: '#234' },
          { idx: EAR_LANDMARKS.LEFT_EAR_MID, label: '#93' },
          { idx: EAR_LANDMARKS.RIGHT_EAR_TOP, label: '#454' },
          { idx: EAR_LANDMARKS.RIGHT_EAR_MID, label: '#323' },
        ];
        for (const pt of earPoints) {
          const p = lm[pt.idx];
          if (!p) continue;
          const q = map(p);
          ctx.beginPath();
          ctx.arc(q.x, q.y, 4 * dpr, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillText(pt.label, q.x + 6 * dpr, q.y);
        }

        // Draw temple points (YELLOW)
        ctx.fillStyle = colors.temple;
        const templePoints = [
          { idx: EAR_LANDMARKS.LEFT_TEMPLE, label: '#127' },
          { idx: EAR_LANDMARKS.RIGHT_TEMPLE, label: '#356' },
          { idx: EAR_LANDMARKS.LEFT_JAW, label: '#147' },
          { idx: EAR_LANDMARKS.RIGHT_JAW, label: '#376' },
        ];
        for (const pt of templePoints) {
          const p = lm[pt.idx];
          if (!p) continue;
          const q = map(p);
          ctx.beginPath();
          ctx.arc(q.x, q.y, 3 * dpr, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillText(pt.label, q.x + 5 * dpr, q.y);
        }

        // Draw face reference (RED)
        ctx.fillStyle = colors.reference;
        const refPoints = [
          { idx: EAR_LANDMARKS.NOSE_TIP, label: '#1' },
          { idx: EAR_LANDMARKS.CHIN, label: '#152' },
          { idx: EAR_LANDMARKS.FOREHEAD, label: '#10' },
        ];
        for (const pt of refPoints) {
          const p = lm[pt.idx];
          if (!p) continue;
          const q = map(p);
          ctx.beginPath();
          ctx.arc(q.x, q.y, 4 * dpr, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillText(pt.label, q.x + 5 * dpr, q.y);
        }

        // Draw lines from ear top to lobe
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
        ctx.lineWidth = 2 * dpr;
        
        // Left side
        const leftTop = lm[EAR_LANDMARKS.LEFT_EAR_TOP];
        const leftLobe = lm[EAR_LANDMARKS.LEFT_EAR_LOBE_A];
        if (leftTop && leftLobe) {
          const t = map(leftTop), l = map(leftLobe);
          ctx.beginPath();
          ctx.moveTo(t.x, t.y);
          ctx.lineTo(l.x, l.y);
          ctx.stroke();
        }

        // Right side
        const rightTop = lm[EAR_LANDMARKS.RIGHT_EAR_TOP];
        const rightLobe = lm[EAR_LANDMARKS.RIGHT_EAR_LOBE_A];
        if (rightTop && rightLobe) {
          const t = map(rightTop), l = map(rightLobe);
          ctx.beginPath();
          ctx.moveTo(t.x, t.y);
          ctx.lineTo(l.x, l.y);
          ctx.stroke();
        }
      }

      ctx.restore();
    }

    // OpenCV helpers
    function makeCameraMatrix(width, height) {
      const f = 0.5 * (width + height);
      const cx = width * 0.5, cy = height * 0.5;
      return {
        K: cv.matFromArray(3, 3, cv.CV_64FC1, [f,0,cx, 0,f,cy, 0,0,1]),
        fx: f, fy: f, cx, cy
      };
    }

    function getModelPoints() {
      return cv.matFromArray(6, 3, cv.CV_64FC1, [
         0.0,   0.0,    0.0,
         0.0, -63.6,  -12.5,
       -43.3,  32.7,  -26.0,
        43.3,  32.7,  -26.0,
       -28.9, -28.9,  -24.1,
        28.9, -28.9,  -24.1
      ]);
    }

    function boot() {
      info.textContent = 'OpenCV ready. Initializing…';

      // Init 3D earring renderer
      initEarringTryOn({ 
        canvas: threeCanvas, 
        mirrorPreview: () => chkMirror.checked,
        showEarrings: () => chkShowEarrings.checked
      });

      let camMat = null, distCoeffs = null, modelPts = null;
      let rvecPrev = null, tvecPrev = null;

      const SMOOTH_R = 0.7, SMOOTH_T = 0.7;

      const faceMesh = new FaceMesh({
        locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/${f}`
      });

      const isAndroid = /Android/i.test(navigator.userAgent);
      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: !isAndroid,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7,
        selfieMode: false
      });

      faceMesh.onResults(results => {
        const cover = drawVideoCover(ctx, video);

        if (!camMat) {
          const vW = video.videoWidth || 1280;
          const vH = video.videoHeight || 720;
          const cam = makeCameraMatrix(vW, vH);
          camMat = cam.K;
          distCoeffs = cv.Mat.zeros(5, 1, cv.CV_64FC1);
          modelPts = getModelPoints();
          window.__INTRINSICS__ = { fx: cam.fx, fy: cam.fy, cx: cam.cx, cy: cam.cy };
        }

        const faces = results.multiFaceLandmarks;
        if (!faces || !faces.length) {
          info.textContent = 'No face detected\n\nMove closer to camera';
          return;
        }

        const lm = faces[0];
        const imgW = video.videoWidth || 1280;
        const imgH = video.videoHeight || 720;

        // SolvePnP for precise 3D pose
        const idx = [1, 199, 263, 33, 291, 61];
        const imagePoints = cv.Mat.zeros(6, 2, cv.CV_64FC1);
        for (let i = 0; i < idx.length; i++) {
          const p = lm[idx[i]];
          imagePoints.doublePtr(i, 0)[0] = p.x * imgW;
          imagePoints.doublePtr(i, 1)[0] = p.y * imgH;
        }

        const rvec = rvecPrev ? rvecPrev.clone() : cv.Mat.zeros(3, 1, cv.CV_64FC1);
        const tvec = tvecPrev ? tvecPrev.clone() : cv.Mat.zeros(3, 1, cv.CV_64FC1);

        const ok = cv.solvePnP(
          modelPts, imagePoints, camMat, distCoeffs,
          rvec, tvec, rvecPrev !== null, cv.SOLVEPNP_ITERATIVE
        );

        if (ok) {
          // Smooth rotation
          if (rvecPrev) {
            const d = rvec.data64F, dp = rvecPrev.data64F;
            d[0] = SMOOTH_R*d[0] + (1-SMOOTH_R)*dp[0];
            d[1] = SMOOTH_R*d[1] + (1-SMOOTH_R)*dp[1];
            d[2] = SMOOTH_R*d[2] + (1-SMOOTH_R)*dp[2];
          }
          // Smooth translation
          if (tvecPrev) {
            const d = tvec.data64F, dp = tvecPrev.data64F;
            d[0] = SMOOTH_T*d[0] + (1-SMOOTH_T)*dp[0];
            d[1] = SMOOTH_T*d[1] + (1-SMOOTH_T)*dp[1];
            d[2] = SMOOTH_T*d[2] + (1-SMOOTH_T)*dp[2];
          }

          // Get rotation matrix
          const rot9 = (() => {
            const R = new cv.Mat();
            cv.Rodrigues(rvec, R);
            const arr = Array.from(R.data64F);
            R.delete();
            return arr;
          })();

          const zmm = Math.abs(tvec.data64F[2]);
          const zcm = (zmm / 10).toFixed(1);

          // Get ear lobe positions
          const leftLobeA = lm[EAR_LANDMARKS.LEFT_EAR_LOBE_A];
          const rightLobeA = lm[EAR_LANDMARKS.RIGHT_EAR_LOBE_A];

          // Update 3D earrings
          updateEarringTryOn({
            landmarks: lm,
            rot9,
            w: imgW,
            h: imgH,
            mirrorPreview: chkMirror.checked,
            tvec: { x: tvec.data64F[0], y: tvec.data64F[1], z: tvec.data64F[2] },
            intrinsics: window.__INTRINSICS__,
            earLobes: {
              left: leftLobeA,
              right: rightLobeA
            }
          });

          // Update info panel
          info.textContent = `✓ Face detected
Distance: ${zcm} cm

Ear Points (CYAN):
  L: #132 (${leftLobeA?.x.toFixed(3)}, ${leftLobeA?.y.toFixed(3)})
  R: #361 (${rightLobeA?.x.toFixed(3)}, ${rightLobeA?.y.toFixed(3)})

Rotation:
  Yaw: ${(rvec.data64F[1] * 180/Math.PI).toFixed(1)}°
  Pitch: ${(rvec.data64F[0] * 180/Math.PI).toFixed(1)}°
  Roll: ${(rvec.data64F[2] * 180/Math.PI).toFixed(1)}°`;

          if (rvecPrev) rvecPrev.delete();
          if (tvecPrev) tvecPrev.delete();
          rvecPrev = rvec.clone();
          tvecPrev = tvec.clone();
        }

        // Draw landmarks
        drawEarLandmarks(ctx, lm, cover);
        
        rvec.delete();
        tvec.delete();
        imagePoints.delete();
      });

      // Start camera
      (async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: 'user',
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
          });
          video.srcObject = stream;
          await video.play();

          await new Promise(r => {
            const check = () => (video.videoWidth > 0) ? r() : requestAnimationFrame(check);
            check();
          });

          const pump = async () => {
            try { await faceMesh.send({ image: video }); } catch {}
            requestAnimationFrame(pump);
          };
          pump();

        } catch (err) {
          info.textContent = 'Camera error: ' + err.message;
        }
      })();

      // Capture button
      captureBtn.addEventListener('click', () => {
        const composite = document.createElement('canvas');
        composite.width = canvas.width;
        composite.height = canvas.height;
        const cctx = composite.getContext('2d');
        cctx.drawImage(canvas, 0, 0);
        cctx.drawImage(threeCanvas, 0, 0);
        
        const link = document.createElement('a');
        link.download = `earring-${Date.now()}.png`;
        link.href = composite.toDataURL('image/png');
        link.click();
      });
    }

    const startIfReady = () => { if (window.cv && typeof cv.Mat === 'function') boot(); };
    window.addEventListener('opencv-ready', startIfReady);
    startIfReady();
  </script>
</body>
</html>
